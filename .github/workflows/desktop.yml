# Builds the DiggyViz Windows app (desktop/) on a Windows runner and attaches the installer and the portable
# .exe to a GitHub Release. Start it by pushing a tag like desktop-v0.1.0, or by hand under Actions.
name: Desktop app (Windows)
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: DiggyViz-Windows
          path: |
            desktop/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          name: DiggyViz voor Windows ${{ github.ref_name }}
          body: "Installer (Setup) of portable .exe. Niet ondertekend: Windows toont 'Onbekende uitgever' → Meer info → Toch uitvoeren."
