name: Android TV-app bouwen
on:
  push:
    paths: ["android-tv/**", ".github/workflows/android-tv.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bouwen
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleRelease
      - name: APK controleren
        run: |
          APK=android-tv/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "$APK"
          $BT/aapt dump badging "$APK" | grep -E "package|leanback|launchable|application-label"
          cp "$APK" DiggyViz-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DiggyViz-TV
          path: DiggyViz-TV.apk
      - name: Publiceren als download (release android-tv)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-tv >/dev/null 2>&1 || gh release create android-tv --prerelease --target "${GITHUB_SHA}" --title "DiggyViz voor Android TV" --notes "Installeer met: adb install -r DiggyViz-TV.apk"
          gh release upload android-tv DiggyViz-TV.apk --clobber
