name: RetroViz
options:
  bundleIdPrefix: be.retroviz
  deploymentTarget:
    iOS: "16.0"
targets:
  RetroViz:
    type: application
    platform: iOS
    sources:
      - RetroViz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.retroviz.app   # mag je veranderen, moet uniek zijn
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                          # kies je team in Xcode > Signing & Capabilities
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: RetroViz/Info.plist
      properties:
        CFBundleDisplayName: RetroViz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: retroviz
            CFBundleURLSchemes:
              - retroviz
